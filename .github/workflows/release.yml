name: Joint release

# Releases the extension, plugin source and every plugin host at one version by
# running release.py. Start it from the Actions tab or the Agent Factory
# chat's Git menu ("Deploy"). Leave the version empty for the next patch; release
# notes are summarized from commit subjects since the last tag.
#
# Requires the RELEASE_TOKEN secret (`python3 release.py setup-token` stores the
# signed-in gh token), or a fine-grained PAT with Contents read/write on
# agent-factory, agent-factory-plugin-source, agent-factory-vscode-extension,
# agent-factory-codex-plugin, agent-factory-claude-plugin and
# agent-factory-antigravity-plugin.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z); empty releases the next patch"
        required: false
        type: string

concurrency:
  group: joint-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Require release token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the RELEASE_TOKEN secret (python3 release.py setup-token)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          gh auth setup-git

      - name: Clone release repositories
        run: |
          # Plain clones (not submodule git files) so release scripts find their .git directories.
          for pair in plugin:agent-factory-plugin-source extension:agent-factory-vscode-extension; do
            dir=${pair%%:*}; repo=${pair#*:}
            rmdir "$dir" 2>/dev/null || true
            git clone --quiet "https://github.com/$OWNER/$repo" "$dir"
          done
          for host in $(python3 -c 'import json; print(" ".join(json.load(open("plugin/distribution/package.json"))["hosts"]))'); do
            git clone --quiet "https://github.com/$OWNER/agent-factory-$host-plugin" "../agent-factory-$host-plugin"
          done
          git fetch --quiet origin --tags
          git checkout --quiet -B main origin/main
          git branch --quiet --set-upstream-to=origin/main main

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci --no-audit --no-fund

      - name: Doctor
        run: |
          python3 release.py hooks
          python3 release.py doctor || true

      - name: Release
        env:
          VERSION: ${{ inputs.version }}
        run: python3 release.py release ${VERSION:+"$VERSION"} --yes

      - name: Upload VSIX
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension/releases/*.vsix
          if-no-files-found: ignore
