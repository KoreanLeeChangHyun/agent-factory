<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Factory Console</title>
<style>
:root {
  color-scheme: dark;
  --bg: #111315;
  --border: #2a2f33;
  --bar: #1a1d20;
  --text: #e7e2d8;
  --muted: #9b968e;
  --accent: #d97757;
  --console-width: 42%;
  --divider-width: 8px;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.combined-shell {
  display: grid;
  grid-template-columns:
    minmax(320px, var(--console-width))
    var(--divider-width)
    minmax(420px, 1fr);
  width: 100vw;
  height: 100vh;
  min-width: 0;
  min-height: 0;
}

.combined-pane {
  position: relative;
  min-width: 0;
  min-height: 0;
  border: 0;
  background: var(--bg);
}

.pane-label {
  position: absolute;
  z-index: 2;
  top: 8px;
  right: 10px;
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 9px;
  border: 1px solid rgba(155, 150, 142, .24);
  border-radius: 4px;
  background: rgba(26, 29, 32, .86);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1;
  text-decoration: none;
  backdrop-filter: blur(8px);
}

.pane-label:hover {
  border-color: rgba(217, 119, 87, .55);
  color: var(--accent);
}

iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: var(--bg);
}

.split-divider {
  position: relative;
  z-index: 5;
  width: var(--divider-width);
  min-width: var(--divider-width);
  height: 100%;
  border: 0;
  border-right: 1px solid var(--border);
  border-left: 1px solid var(--border);
  background: var(--bar);
  cursor: col-resize;
  touch-action: none;
}

.split-divider::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 2px;
  height: 42px;
  border-radius: 2px;
  background: rgba(155, 150, 142, .45);
  transform: translate(-50%, -50%);
}

.split-divider:hover::after,
.combined-shell.is-resizing .split-divider::after {
  background: var(--accent);
}

.combined-shell.is-resizing iframe {
  pointer-events: none;
}

@media (max-width: 980px) {
  .combined-shell {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(320px, 44fr) var(--divider-width) minmax(460px, 56fr);
  }

  .split-divider {
    width: 100%;
    height: var(--divider-width);
    min-width: 0;
    min-height: var(--divider-width);
    border-top: 1px solid var(--border);
    border-right: 0;
    border-bottom: 1px solid var(--border);
    border-left: 0;
    cursor: row-resize;
  }

  .split-divider::after {
    width: 42px;
    height: 2px;
  }
}
</style>
</head>
<body>
<main class="combined-shell" id="combined-shell">
  <section class="combined-pane" aria-label="Agent Factory Console">
    <a class="pane-label" href="terminal.html" target="_blank" rel="noopener">Console</a>
    <iframe src="terminal.html" title="Agent Factory Console"></iframe>
  </section>
  <div class="split-divider" id="split-divider" role="separator" aria-label="Resize panes" aria-orientation="vertical" tabindex="0"></div>
  <section class="combined-pane" aria-label="Agent Factory Board">
    <a class="pane-label" href="board.html" target="_blank" rel="noopener">Board</a>
    <iframe src="board.html" title="Agent Factory Board"></iframe>
  </section>
</main>
<script>
(function () {
  var shell = document.getElementById("combined-shell");
  var divider = document.getElementById("split-divider");
  var storageKey = "agentFactoryConsoleWidth";
  var legacyStorageKey = "agentFactoryCombinedTerminalWidth";
  var minConsole = 320;
  var minBoard = 420;

  function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
  }

  function applyWidth(px) {
    var rect = shell.getBoundingClientRect();
    var max = Math.max(minConsole, rect.width - minBoard - divider.offsetWidth);
    var next = clamp(px, minConsole, max);
    shell.style.setProperty("--console-width", next + "px");
    return next;
  }

  function restoreWidth() {
    var saved = Number(localStorage.getItem(storageKey) || localStorage.getItem(legacyStorageKey));
    if (Number.isFinite(saved) && saved > 0) {
      applyWidth(saved);
    }
  }

  function startResize(event) {
    if (window.matchMedia("(max-width: 980px)").matches) {
      return;
    }
    event.preventDefault();
    shell.classList.add("is-resizing");
    divider.setPointerCapture(event.pointerId);

    function move(moveEvent) {
      var rect = shell.getBoundingClientRect();
      var next = applyWidth(moveEvent.clientX - rect.left);
      localStorage.setItem(storageKey, String(next));
    }

    function stop(stopEvent) {
      shell.classList.remove("is-resizing");
      divider.releasePointerCapture(stopEvent.pointerId);
      divider.removeEventListener("pointermove", move);
      divider.removeEventListener("pointerup", stop);
      divider.removeEventListener("pointercancel", stop);
    }

    divider.addEventListener("pointermove", move);
    divider.addEventListener("pointerup", stop);
    divider.addEventListener("pointercancel", stop);
  }

  divider.addEventListener("pointerdown", startResize);
  window.addEventListener("resize", restoreWidth);
  restoreWidth();
})();
</script>
</body>
</html>
