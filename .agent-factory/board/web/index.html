<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Factory Console</title>
<link rel="stylesheet" href="css/widgets/settings.css">
<style>
:root {
  color-scheme: dark;
  --af-bg: #1E1E1E;
  --af-surface: #181818;
  --af-surface-raised: #252526;
  --af-border: #2D2D2D;
  --af-border-soft: #333333;
  --af-text: #CCCCCC;
  --af-text-muted: #858585;
  --af-text-subtle: #5A5A5A;
  --brain-accent: #D97757;
  --brain-accent-soft: rgba(217, 119, 87, 0.18);
  --af-primary: #007ACC;
  --af-primary-soft: rgba(0, 122, 204, 0.16);
  --af-success: #4EC9B0;
  --af-success-soft: rgba(78, 201, 176, 0.16);
  --af-warning: #DCDCAA;
  --af-warning-soft: rgba(220, 220, 170, 0.16);
  --af-error: #F48771;
  --af-error-soft: rgba(244, 135, 113, 0.16);
  --af-info: #9CDCFE;
  --af-info-soft: rgba(156, 220, 254, 0.16);
  --af-accent: #C586C0;
  --af-accent-soft: rgba(197, 134, 192, 0.16);
  --af-code: #CE9178;
  --af-inverse: #FFFFFF;
  --af-overlay: rgba(0, 0, 0, 0.48);
  --af-hover: rgba(255, 255, 255, 0.06);
  --af-hover-strong: rgba(255, 255, 255, 0.1);
  --bg: #1E1E1E;
  --border: #2D2D2D;
  --bar: #181818;
  --text: #CCCCCC;
  --muted: #858585;
  --accent: #007ACC;
  --console-width: 42%;
  --divider-width: 8px;
}

:root[data-brain="claude"] {
  --brain-accent: #D97757;
  --brain-accent-soft: rgba(217, 119, 87, 0.18);
  --af-primary: var(--brain-accent);
  --af-primary-soft: var(--brain-accent-soft);
  --accent: var(--brain-accent);
}

:root[data-brain="codex"] {
  --brain-accent: #10A37F;
  --brain-accent-soft: rgba(16, 163, 127, 0.18);
  --af-primary: var(--brain-accent);
  --af-primary-soft: var(--brain-accent-soft);
  --accent: var(--brain-accent);
}

:root[data-brain="gemini"] {
  --brain-accent: #4796E3;
  --brain-accent-soft: rgba(145, 119, 199, 0.18);
  --af-primary: var(--brain-accent);
  --af-primary-soft: var(--brain-accent-soft);
  --accent: var(--brain-accent);
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.combined-shell {
  display: grid;
  grid-template-columns:
    minmax(320px, var(--console-width))
    var(--divider-width)
    minmax(420px, 1fr);
  width: 100vw;
  height: 100vh;
  min-width: 0;
  min-height: 0;
}

.combined-pane {
  position: relative;
  min-width: 0;
  min-height: 0;
  border: 0;
  background: var(--bg);
}

iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: var(--bg);
}

.console-settings-toggle {
  position: fixed;
  z-index: 700;
  top: 10px;
  right: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: rgba(24, 24, 24, 0.88);
  color: var(--muted);
  cursor: pointer;
  opacity: 0.78;
  backdrop-filter: blur(8px);
  transition: opacity 0.15s, color 0.15s, border-color 0.15s, background 0.15s;
}

.console-settings-toggle:hover {
  border-color: var(--accent);
  background: #252526;
  color: var(--text);
  opacity: 1;
}

.split-divider {
  position: relative;
  z-index: 5;
  width: var(--divider-width);
  min-width: var(--divider-width);
  height: 100%;
  border: 0;
  border-right: 1px solid var(--border);
  border-left: 1px solid var(--border);
  background: var(--bar);
  cursor: col-resize;
  touch-action: none;
}

.split-divider::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 2px;
  height: 42px;
  border-radius: 2px;
  background: #5A5A5A;
  transform: translate(-50%, -50%);
}

.split-divider:hover::after,
.combined-shell.is-resizing .split-divider::after {
  background: var(--accent);
}

.combined-shell.is-resizing iframe {
  pointer-events: none;
}

@media (max-width: 980px) {
  .combined-shell {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(320px, 44fr) var(--divider-width) minmax(460px, 56fr);
  }

  .split-divider {
    width: 100%;
    height: var(--divider-width);
    min-width: 0;
    min-height: var(--divider-width);
    border-top: 1px solid var(--border);
    border-right: 0;
    border-bottom: 1px solid var(--border);
    border-left: 0;
    cursor: row-resize;
  }

  .split-divider::after {
    width: 42px;
    height: 2px;
  }
}
</style>
</head>
<body>
<main class="combined-shell" id="combined-shell">
  <section class="combined-pane" aria-label="Agent Factory Console">
    <iframe src="terminal.html" title="Agent Factory Console"></iframe>
  </section>
  <div class="split-divider" id="split-divider" role="separator" aria-label="Resize panes" aria-orientation="vertical" tabindex="0"></div>
  <section class="combined-pane" aria-label="Agent Factory Board">
    <iframe id="board-frame" src="board.html" title="Agent Factory Board"></iframe>
  </section>
</main>
<button class="console-settings-toggle" id="settings-toggle" title="Settings" aria-label="Settings">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>
<div class="settings-overlay" id="settings-overlay"></div>
<div class="settings-panel" id="settings-panel">
  <div class="settings-resize-handle" id="settings-resize-handle" title="Resize settings panel" aria-hidden="true"></div>
  <div class="settings-header">
    <h2>Settings</h2>
    <button class="settings-close" id="settings-close">&times;</button>
  </div>
  <div class="settings-body" id="settings-body"></div>
</div>
<script src="js/core/brain-theme.js"></script>
<script>
(function () {
  var shell = document.getElementById("combined-shell");
  var divider = document.getElementById("split-divider");
  var storageKey = "agentFactoryConsoleWidth";
  var legacyStorageKey = "agentFactoryCombinedTerminalWidth";
  var minConsole = 320;
  var minBoard = 420;

  function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
  }

  function applyWidth(px) {
    var rect = shell.getBoundingClientRect();
    var max = Math.max(minConsole, rect.width - minBoard - divider.offsetWidth);
    var next = clamp(px, minConsole, max);
    shell.style.setProperty("--console-width", next + "px");
    return next;
  }

  function restoreWidth() {
    var saved = Number(localStorage.getItem(storageKey) || localStorage.getItem(legacyStorageKey));
    if (Number.isFinite(saved) && saved > 0) {
      applyWidth(saved);
    }
  }

  function startResize(event) {
    if (window.matchMedia("(max-width: 980px)").matches) {
      return;
    }
    event.preventDefault();
    shell.classList.add("is-resizing");
    divider.setPointerCapture(event.pointerId);

    function move(moveEvent) {
      var rect = shell.getBoundingClientRect();
      var next = applyWidth(moveEvent.clientX - rect.left);
      localStorage.setItem(storageKey, String(next));
    }

    function stop(stopEvent) {
      shell.classList.remove("is-resizing");
      divider.releasePointerCapture(stopEvent.pointerId);
      divider.removeEventListener("pointermove", move);
      divider.removeEventListener("pointerup", stop);
      divider.removeEventListener("pointercancel", stop);
    }

    divider.addEventListener("pointermove", move);
    divider.addEventListener("pointerup", stop);
    divider.addEventListener("pointercancel", stop);
  }

  divider.addEventListener("pointerdown", startResize);
  window.addEventListener("resize", restoreWidth);
  restoreWidth();

  var boardFrame = document.getElementById("board-frame");
  if (boardFrame) {
    function exposeBoardFrameNamespace() {
      try {
        if (boardFrame.contentWindow && boardFrame.contentWindow.Board) {
          window.Board = boardFrame.contentWindow.Board;
        }
      } catch (_) {}
    }
    boardFrame.addEventListener("load", exposeBoardFrameNamespace);
    setTimeout(exposeBoardFrameNamespace, 0);
    setTimeout(exposeBoardFrameNamespace, 500);
    setTimeout(exposeBoardFrameNamespace, 1500);
  }
})();
</script>
<script src="js/views/settings.js"></script>
</body>
</html>
