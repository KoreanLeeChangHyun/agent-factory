# ==============================================================================
# defaults.conf — build.sh
# build.sh is a file that loads source.
# ==============================================================================

# --- Load set value from .settings/.env (unless override, use the following default) ---
# . settings prior reference, if not .env foldback (low-compliant)
if [[ -f ".agent-factory/.settings" ]]; then
    _ENV_FILE="${_ENV_FILE:-.agent-factory/.settings}"
else
    _ENV_FILE="${_ENV_FILE:-.agent-factory/.env}"
fi
if [[ -f "$_ENV_FILE" ]]; then
    _val=$(grep -E '^(AGENT_FACTORY_REQUIRED_PYTHON_MAJOR|CLAUDE_REQUIRED_PYTHON_MAJOR)=' "$_ENV_FILE" 2>/dev/null | head -1 | cut -d= -f2 || true)
    [[ -n "$_val" ]] && REQUIRED_PYTHON_MAJOR="$_val"
    _val=$(grep -E '^(AGENT_FACTORY_REQUIRED_PYTHON_MINOR|CLAUDE_REQUIRED_PYTHON_MINOR)=' "$_ENV_FILE" 2>/dev/null | head -1 | cut -d= -f2 || true)
    [[ -n "$_val" ]] && REQUIRED_PYTHON_MINOR="$_val"
    _val=$(grep -E '^(AGENT_FACTORY_REPO_URL|CLAUDE_REPO_URL)=' "$_ENV_FILE" 2>/dev/null | head -1 | cut -d= -f2- || true)
    [[ -n "$_val" ]] && AGENT_FACTORY_REPO_URL="$_val"
    unset _val
fi
unset _ENV_FILE

# --- Python minimum version (default, .settings/.env overrideable) ---
REQUIRED_PYTHON_MAJOR=${REQUIRED_PYTHON_MAJOR:-3}
REQUIRED_PYTHON_MINOR=${REQUIRED_PYTHON_MINOR:-9}

# --- Directory List to Create ---
INIT_DIRS=(".agent-factory/tickets" ".agent-factory/tickets/todo" ".agent-factory/tickets/open" ".agent-factory/tickets/progress" ".agent-factory/tickets/review" ".agent-factory/tickets/done" ".agent-factory/runs/.history" ".agent-factory/runs/temp")

# --- List of files to be created (only touch if not exist) ---
INIT_FILES=("CLAUDE.md" "AGENTS.md")

# --- .gitignore required items ---
GITIGNORE_ENTRIES=(
    "CLAUDE.md"
    "__pycache__/"
    "temp/"
    ".vscode/"
)

# --- Agent Factory repository URL (default, overrideable from .settings/.env) ---
AGENT_FACTORY_REPO_URL="${AGENT_FACTORY_REPO_URL:-https://github.com/KoreanLeeChangHyun/claude-workflow.git}"

# --- Template file path (script standard relative path) ---
TMPL_DIR=".agent-factory/build-assets/templates"
TMPL_SETTINGS="${TMPL_DIR}/settings.json.tmpl"
TMPL_CLAUDE_ENV="${TMPL_DIR}/claude-env.tmpl"
TMPL_CLAUDE_ALIASES="${TMPL_DIR}/claude-aliases.tmpl"
