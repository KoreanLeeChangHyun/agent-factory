[pytest]
addopts = -q
testpaths =
    tests
pythonpath =
    .
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    runs
    tickets
    # M1 quarantine: stale V1/package-collision roots remain outside
    # canonical collection until rewritten or deleted.
    engine/flow/tests
    engine/flow/auditor/tests
    board/tests
    board/server/tests
