# Configurator (Organic Engineering) — Project Roadmap
#
# This file is a set of memory `project design direction.md` (2026-04-23, 357 lines).
# The existing memory will be preserved after the archived notation, and will update all the vision and beauty of the future.
#
# Tag:
#   - phases[]: a large area (one lump of tissue/system dimensions)
#       body: Shandong Vision·Round·Metapo (markable free)
#       Miletones[]: specific items that should be tracked in that area
#   - milestones[].status: planned | in-progress | done
#   - Miletones[].tickets: linked ticket ID list
#
# Editing is currently correct text directly. The editorial UI is the follow-up milestone (`uiux.roadmap-editor`).

phases:
  # ──────────────────────────────────────────────────────────────────────
  - id: principles
    title: System essence/principles
    body: |
      ## Methodology Name

      **Organic Engineering** — Software development methodology implemented by claude-workflow. user
      Justice (2026-04-10). The goal is to continue developing this method until it becomes mainstream.

      ### The meaning of the name (variable characteristics)

      - **Operates organically like an organization** — Role division, delegation, and reporting system
      - **Memory has a biological life cycle** — Creation (memorizing), organization (GC), promotion (long-term memory)
      - **Evolution through feedback** — Circular loop of log, analysis, and improvement
      - **Breaking with the context window** — Fresh context for each session, selectively loading only what you need
      - **UI/UX constant improvement** — Surface that is not fixed once but is refined through use
      - Not just a simple workflow tool, but a philosophy of **the way the software is created itself**

      ## The essence of system

      claude-workflow is not a simple workflow tool, but an organization to lead the project well.
      It is a system (Organic Engineering)**.

      - Mini organization where users (clients) collaborate with team leaders (main clode) to carry out projects
        Simulate.
      - All components, including tickets, workflow, subagents, and skills, are designed as **organizational operation metaphor**.
      - Design judgment criteria: “How to deal with this situation in real organization?”
      - **Consistency of organizational principles** takes priority over technical convenience.
      - Example: “Team leader doesn’t work directly” = principle of not directly modifying the main clode
      - Example: “The time of the client is precious” = Principle of minimizing conversation waiting

      ## Basic 4-story structure

      ```mermaid
      flowchart TD
        User["User (Client)"]
        Main["Main Clod (Team Leader)<br/>Brainstopping and ticketing / Tuning"]
        Worker["Work Clad (President Director)<br/>Workflow Orchestration · Team Leader Report"]
        Sub["Sub-Action <br/> Design / Job / Verification / Report"]
        User -->|"Kanban Board / Main Terminal"| Main
        Main -->|"flow-launcher"| Worker
        Worker -->|"Dental"| Sub
      ```

      ## Core Principles

      - The main clode **does not modify directly** — In principle, it is delegated to the work clode after creating a ticket.
      - Brainstorming takes place only between **people ↔ main group**, and the results are embodied in tickets.
      - The task clode receives the ticket prompt (goal/target/constraints/criteria/context) as a contract and executes it.
      - **The weight of your workflow should be proportional to the ticket workload** — 5 heavy steps for a simple fix
        If the workflow is forced, users will bypass the workflow due to cost and time overload.
        Traceability is broken. Effort-based branching is a fundamental requirement for usability.
      - **The main clod utilizes a Python script (`flow-*` bin wrapper)** when manipulating the workflow.
        SSoT is `.agent-factory/engine/flow/*.py`. JS/TS (Board UI) is for visualization only, no permission to change state.
      - **Minimize waiting in user-team leader conversations** — Delegate heavy cognitive tasks and keep the conversation flowing
        We must continue. (a) Asynchronous delegation path, (b) result return channel, (c) conversation context merging.
        Mechanisms required — all current design gaps (see `pipeline-gaps` phase).

      ## Commission Path Review (Option 2)

      Separate the team leader's delegation into two paths: **Secretary** and **Field Supervisor**.

      - **Secretary = Separate Claude Session** (not a sub-agent)
        - Independent sessions equivalent to field supervision, but without ticket/FSM/workflow overhead
        - Use: Simple research, fact checking, information inquiry during conversation
        - The result is in the form of an answer that is absorbed into the conversation
      - **Onsite Supervision = Workflow Session** (Existing Job Claude)
        - Ticket-based, full FSM (PLAN→WORK→REPORT→DONE) performance
        - Results remain as artifacts

      The team leader chooses one of the two depending on the nature of the request.

      ## Design maturity and correction attitude

      - Workflow framework (FSM, skill mapping, verification device, subagent role separation, artifact calculation)
        Obligations) are **mature assets** designed over several months.
      - **The framework itself is not a sanctuary** — Accept radical redesign if there is a better approach.
      - When making an improvement proposal, both the existing structural improvement plan and the fundamental redesign plan are reviewed and evaluated as cost/effectiveness.
        judge. (Reference case: GSD-2 — prompt framework → standalone CLI fundamental conversion
        Solving the "heavy orchestration" problem)
    milestones: []

  # ──────────────────────────────────────────────────────────────────────
  - id: workflow-model
    title: Workflow/Skill Model
    body: |
      ## SubAgent 4 Stage Role Model

      It is a general-purpose work life cycle that is not limited to coding.

      ```mermaid
      flowchart LR
        Plan["<br/>planner"]
        Work["<br>worker / explorer"]
        Verify["Verification<br/>validator"]
        Report["REPORTER"]
        Plan --> Work
        Work --> Verify
        Verify --> Report
      ```

      | steps | Role | applicable agent | Main deliverables |
      |------|------|--------------|----------|
      | Design | Problem decomposition, planning, task division | planner | `plan.md` |
      | work | Actual performance (execution type/investigation type) | worker, explorer | `work/WXX-*.md` |
      | verification | Check result consistency and quality | validator | `work/validation-report.md` |
      | report | Output synthesis/summary | reporter | `report.md` |

      worker/explorer are two types of work steps — worker is execution/implementation/editing, explorer is
      Investigation, analysis, research. It belongs to the same “Work” stage. Step 4 is FSM’s PLAN→WORK→REPORT→DONE
      It corresponds to and is domain-neutral, so it applies equally to tasks other than coding (documents/reviews/planning).

      ## Workflow Stage Model — FSM vs UI 2-Point

      The two perspectives coexist. FSM is used when rigor is required, and UI model is used when discussing user visibility.

      **Execution FSM (workflow-orchestration SKILL, step 4)**

      ```mermaid
      stateDiagram-v2
        [*] --> PLAN
        PLAN --> WORK
        WORK --> REPORT
        REPORT --> DONE
        DONE --> [*]
        PLAN --> FAILED
        WORK --> FAILED
        REPORT --> FAILED
        PLAN --> CANCELLED
        WORK --> CANCELLED
        REPORT --> CANCELLED
        PLAN --> STALE
        WORK --> STALE
        REPORT --> STALE
      ```

      **User visible UI (Board workflow-bar, 5 panels)**

      ```mermaid
      flowchart LR
        INIT --> PLAN
        PLAN --> WORK
        WORK --> REPORT
        REPORT --> DONE
      ```

      5 types of `STEP_COLORS` in `workflow-bar.js`. INIT is `flow-init` before loading the orchestrator.
      Preprocessing performed — creating workflow directory, initializing status.json, registering registry —
      “Sessions are started” provides visibility. INIT is for UI use only and is not an official state for FSM.

      ## Skill 3-type Classification

      Workflow specialization skills are divided into three types depending on **effect on workers (sub-agents)**.

      | Category | effect | worker perspective | load criteria |
      |------|------|------------|----------|
      | Specialization Skills | Transform workers into experts in their field | "I'm a professional in this field" | Select load based on task type |
      | Guidance Skills | Rules/conventions that workers must follow | “I cannot violate this rule” | Forced injection in a work context |
      | Project Skills | Knowledge for workers to understand the project | "I know this project" | Always load per project |

      ### Current `.claude/skills/` Mapping with Dockers (Fixed)

      | Category | corresponding prefix |
      |------|------------|
      | Specialization Skills | review-*, design-*, framework-*, testing-*, debug-*, analyze-*, research-*, devops-*, management-* |
      | Guidance Skills | convention-* |
      | Project Skills | my-* (prefix reserved, no actual skills at present) |

      ## Domain Metapot — Tickets

      Ticket = **What needs to be done** (work brief / work specification / contract). Client and team leader
      Agreed work request. Currently there are 5 prompt fields (goal/target/constraints/criteria/context)
      Subject to contractual provisions. Execution is ordered into task clouds.

      ## Run workflow route (man → main → work)

      ```mermaid
      sequenceDiagram
        actor User as person
        participant Main as Main Claude
        participant Launcher as flow-launcher
        participant Server as server.py
        participant Worker as task group
        User->>Main: /wf -s N (main terminal)
        Main->>Launcher: launch T-NNN '/wf -s N'
        Launcher->>Server: POST /terminal/workflow/start
        Server->>Worker: subprocess.Popen(claude CLI)
        Note over Server,Worker: env=_WF_TICKET_ID=T-NNN
        Worker->>Worker: Receive /wf -s N as stdin
        Worker->>Worker: load wf skill → flow-kanban show T-NNN
        Worker->>Worker: Ticket prompt contract based execution
      ```

      Inject environment variables: `_WF_SESSION_TYPE=workflow`, `_WF_TICKET_ID`, `_WF_SESSION_ID`,
      `_WF_SERVER_PORT`. Re-entry prevention — When detecting `_WF_SESSION_TYPE=workflow`, the flow-launcher
      Switch to INLINE fallback.
    milestones:
      - id: skill-3type-system
        title: Reflection of skill 3-type classification structure
        status: planned
        body: |
          Currently, it is at the prefix naming convention level. It is not structurally reflected in the system.

          - **Classification system not reflected**: 3-type is not in this skill system’s internal data/manifest
          - **Single grant method**: `skill_mapper.py` only performs plan.md-based mapping of specialization skills.
            There is no other method of granting instruction/project skills.
          - **Undesigned forced injection of guideline skills**: Absence of mechanism to structurally guarantee “{{if price varies}}from {{/if}}”.
          - **Project Skill Load Not Designed**: The `my-*` prefix is ​​only for distinguishing the current update policy, session
            No autoload path.
          - **Lack of management tools**: Lack of integrated management CLI/UI for skill registration, classification, verification, activation/deactivation.
        tickets: []

      - id: workload-based-routing
        title: Workflow branching based on workload (lightweight workflow)
        status: planned
        body: |
          The current full workflow (ticket → phase → task → report) + work tree isolation is suitable for small modifications.
          Overhead. One of the reasons why users often choose to edit directly is the heaviness of the full workflow.

          **Direction**: Introduction of lightweight tracks. A simple route that involves changing the code with minimal steps → reviewing the results.
          Specific specifications not yet determined.

          **Prerequisites**:
          - Full workflow + work tree isolation stabilization. Currently `WORKFLOW_WORKTREE=false` is disabled.
          - Work tree conversion must occur first.

          **Design Constraints**:
          - Ticket FSM, Runner, and History schemas can be used in lightweight mode as a shared/subset of existing schemas.
            Maintain the design.
          - No detailed suggestions are made until the user pulls out the full specifications (current direction sharing level).
        tickets: []

      - id: ticket-form-by-type
        title: Differentiation by ticket form work type
        status: planned
        body: |
          Currently implement/research/review all tickets use the same 5-field form. as an organizational metaphor
          If you look at it, it is natural that the contract form should be different for each type of work.

          | Type | Contract structure (example) |
          |------|-------------------|
          | implement | Implementation Goals, Fix Targets, Constraints, Completion Criteria, Context |
          | research | Research Questions, Scope, Depth, Report Criteria |
          | review | Review target, review perspective, focus, checklist |
          | bugfix | Reproducibility conditions, symptoms, expected behavior, scope of correction |
          | refactor | Current structure, target structure, immutability guarantees, metrics |
          | docs | Document audience, audience, scope, tone |

          This advancement is linked to the “Workflow Weight = Ticket Duty Free” principle. A mild bugfix is
          Lightweight workflows, heavy refactors can be routed naturally to the entire FSM.
        tickets: []

      - id: supervisor-to-leader-report
        title: On-site supervision → Team leader reporting system
        status: planned
        body: |
          There is a mechanism to report workflow completion/failure/intermediate status in a structured form to the main clod.
          Not yet. Currently, it is only delivered to file system (status.json, report.md) and Board UI events.

          What is required:
          - Work clode → Main clode direct reporting channel
          - Reporting format standards (summaries, decisions, links to deliverables)
          - A form absorbed into the conversation context of the main clade
        tickets: []

  # ──────────────────────────────────────────────────────────────────────
  - id: memory-lifecycle
    title: Memory/Session Lifecycle
    body: |
      ## context / memory / session problem

      It is a fundamental problem in which all three axes are tense at the same time.

      | axis | problem | Organization Metaphor |
      |----|------|-------------|
      | Context | Session window limitation, cumulative pollution as conversation becomes longer | Team Leader's Head Capacity Limits |
      | memory | Volatilizes at the end of the session, starts again tomorrow from the beginning | Institutional memory in organizations |
      | session | Team leader/site director/secretary are independent and cannot share knowledge with each other | Information gap among conference attendees |

      ## Structured memory loading direction (total)

      - Rules (`.claude/rules/`) are absolutely loaded in every session — immutable.
      - Memory is designed as a **selective loading layer** that sits on top of the rules.
      - Loading axis: Role (team leader/site foreman/secretary) × loading condition (session start, explicit request, etc.) mixed direction
        Discussing.

      ## Memory Lifecycle (directional)

      ```mermaid
      flowchart LR
        subgraph Short["About Us"]
          Memo["<br/> cycle snapshot"]
          GC["GC<br/>"]
          Discard["Mobile Site"]
        end
        subgraph Long["Size"]
          Skill["Project Skills<br/>my-* Dock"]
        end
        Memo -->|"Scots Gaelic"| Skill
        Memo --> GC
        GC --> Discard
      ```

      - **Memorizing**: At certain intervals, the current project status, progress rate, and key points to continue in the next session are recorded.
        Automatic recording.
      - **GC**: Automatically cleans up unnecessary memorizing at specific cycles.
      - **Long-term memory**: Converts to project skill (`my-*`) when passing the promotion decision.

      ## Automated Bounds (Thickness)

      | area | autocorrect | Placement method |
      |------|----------|-----------|
      | rules | Ban | Written by humans, strictly selected |
      | Expert Skills | Ban | Person-directed placement, strict selection |
      | Convention Skills | Ban | Person-directed placement, strict selection |
      | Memorizing | allow | Periodic automatic recording |
      | GC | allow | Periodic automatic cleanup |
      | Promotion (Memo → Project Skill) | semi-automatic | Assistant Rating + User Approval |
    milestones:
      - id: mem-memorize-auto
        title: Memorizing Automation (Cycle Snapshot)
        status: planned
        body: |
          Automatically creates memory files at specific cycles/conditions.

          **Decision Required**:
          - Define the meaning of “Specific %” (Context usage? Time? Number of turns?)
          - Memorizing trigger (immediate/batch)
          - What to save (conversation summary, decisions made, key points to carry over to next session)
        tickets: []

      - id: mem-gc
        title: GC automatic cleanup
        status: planned
        body: |
          Periodically clear out unnecessary memorization.

          **Decision Required**:
          - GC trigger (period? threshold?)
          - Judgment rules to be cleaned up (outdated ones? unreferenced ones? low scoring ones?)
          - Retention period policy

          **UI aspect**: No sync/GC button on current memory screen. Manual GC trigger in the Memory subtab.
          Exposure first is also an option.
        tickets: []

      - id: mem-promotion-pipeline
        title: Promotion Pipeline (Memo → Project Skill)
        status: planned
        body: |
          ```mermaid
          flowchart TD
            Memo["Scots Gaelic"]
            Q1["Queue 1<br/>Received"]
            Sec["Team secretary<br/>Rating rules evaluation"]
            Q2["Queue 2<br/>User check waiting"]
            Leader["Team Leader<br/>Receive request"]
            User["Scots Gaelic"]
            Skill["Skip to content"]
            GC["GC"]
            Memo --> Q1
            Q1 --> Sec
            Sec -->|"Mobile Site"| GC
            Sec -->|"Sponsors"| Q2
            Q2 --> Leader
            Leader --> User
            User -->|"Notice"| Skill
            User -->|"About Us"| GC
            User -->|"About Us"| Q2
          ```

          - **Expanded role of secretary**: Includes not only simple search but also gatekeeper (judgment/filtering) role
          - **Final authority is yours**: No automatic promotion, human approval required
          - **2-step queue required**: Wait for assistant evaluation / Wait for user confirmation

          **Decision Required**:
          - Queue storage location and format
          - Promotion rule format and storage location
          - User Verification UX (Board Badges/Terminal Notifications)
          - No-response timeout policy
          - Project skill promotion result format (SKILL.md automatically generated or not)
        tickets: []

      - id: mem-structuring
        title: Structure memory directory
        status: planned
        body: |
          Currently 21 memory files are flattened into a single directory: `~/.claude/projects/.../memory/`.
          File name conventions are also mixed (snake_case `feedback_*`, kebab-case `user-*`, no prefix).

          **direction**:
          - Subdirectories by category (`feedback/`, `issue/`, `topic/`, `archive/`, etc.)
          - Unification of file name conventions
          - Inline data (Project Context, design decisions) external file
          - Introduction of lifecycle (active/archive) — GC automatic cleanup entry point
        tickets: []

  # ──────────────────────────────────────────────────────────────────────
  - id: pipeline-gaps
    title: Asynchronous delegation/result return
    body: |
      In order for the “In the user-team leader conversation, we minimize” principle to be established, the following three mechanisms are required:
      All are needed — all are current design gaps.

      1. **Asynchronous delegation path** — Start a background session with instructions such as "{{ data.filesizeHumanReadable }}" and the conversation begins.
         keep going
      2. **Results Return Channel** — A structured report to team leaders upon completion of background tasks.
         mechanism
      3. **Merge conversation context** — Team leader merges reports that arrive mid-conversation into the current conversation flow.
         How to naturally absorb

      It is an extension of the “The main closure does not directly modify” principle. Do not edit directly → Delegate
      → Receive the results → Incorporate them into the conversation. The time burden felt by the user is reduced only when the overall flow of .
    milestones:
      - id: brainstorm-protocol
        title: Brainstorming → Ticketing Protocol
        status: planned
        body: |
          There is no explicit protocol to converge human ↔ main clode conversations into ticketing. Currently the main
          The session makes appropriate decisions, but consistency guarantees are weak.

          - Automatic extraction of ticket candidates
          - Automatic branching of `/wf -o` after user confirmation
          - Automatically fill goal/target/constraints/criteria/context in conversation context
        tickets: []

      - id: async-research-delegation
        title: Asynchronous Investigation Delegation
        status: planned
        body: |
          During the conversation, a background check session is launched with an instruction like "{{ data.filesizeHumanReadable }}" and the conversation continues.
          The route you take. Secretary (separate Claude session) Primary embodiment of the metaphor.

          - Background session spawn path
          - Visualization of progress
          - Notify team leader upon completion
        tickets: []

      - id: result-return-channel
        title: Result Return Channel
        status: planned
        body: |
          Structured reporting to team leaders upon completion of background tasks (workflow sessions + secretarial sessions)
          Mechanism of delivery. Partial overlap with `workflow-model.supervisor-to-leader-report`.

          - Report arrival queue
          - Notify the main session
          - Visible to users
        tickets: []

      - id: conversation-merge
        title: Merge conversation context
        status: planned
        body: |
          A method in which the team leader naturally absorbs reports that arrive in the middle of a conversation into the current conversation flow.

          - When and how to inject report content context
          - Separation of user visibility vs internal context
        tickets: []

  # ──────────────────────────────────────────────────────────────────────
  - id: feedback-loop
    title: Feedback loop/logging
    body: |
      **Cycle structure of work log recording → analysis → system improvement**. Not just records, but the system itself.
      An evolving feedback loop.

      Organizational Metaphor: **Performance Review + Process Improvement** System.

      #News

      | axis | Content | Organization Metaphor |
      |----|------|-------------|
      | Job log records | Detailed records of all workflow executions | Journal / Audit Records |
      | Analysis | Aggregation·Pattern extraction·Anomaly detection | Regular retrospective / performance analysis |
      | System Improvements | Adjust rules/skills/workflow based on analysis results | Process Improvement |
      | Usage Tracking | Token·Time·Session Statistics | Resource Usage Reporting |
      | Skill usage analysis | What professional skills are frequently used | Expertise demand analysis |
      | Skill load consistency | Verify that skills are loading as intended | Expertise Placement Verification |

      ### Especially important principles

      “If you want to know what you want,” verification is not just statistics **Design intent vs. actual behavior
      It is a coincidence verification**. This becomes more important when the skill 3-type classification is introduced — “This job requires
      Verification such as "It was supposed to be loaded, but Y was actually loaded" should be possible.

      ## Current Status

      | Features | Current Implementation | limit |
      |------|----------|------|
      | job log | `workflow.log`, `status.json`, `work/*.md` | No aggregation/analysis tools |
      | Usage Tracking | `usage_tracker.py`, `usage.json` | Collection is possible, but dashboard is immature |
      | Skill Status | `skill_state_manager.py`, `skill-catalog.md` | Frequency tracking exists in some |
      | Dashboard | Board UI, `board/data/history.md` | Absence of integrated log/usage view |
      | Analysis → Improvement Loop | None | All manual |
    milestones:
      - id: log-aggregation
        title: Log aggregation and analysis tool
        status: planned
        body: |
          How to query existing data. Aggregation by workflow/skill/time zone.
        tickets: []

      - id: dashboard-integration
        title: Dashboard integration (single view of log, usage, skill status)
        status: planned
        body: |
          Expand Board Dashboard to integrated log/usage/skill view. Currently fragmentary.
        tickets: []

      - id: skill-load-integrity
        title: Skill load consistency verification
        status: planned
        body: |
          “This work had to load X skill, and actually Y was loaded” verification.

          - Intended skill road mapping specification
          - Compare with actual load records
          - Automatic detection and warning of discrepancies
        tickets: []

      - id: feedback-auto-improvement
        title: Analysis → Improvement Automatic Feedback
        status: planned
        body: |
          Automatically adjusts the system itself based on analysis results. Example: Detect skill load consistency anomaly → Mapping rule
          Suggesting improvement candidates.

          Currently everything is manual.
        tickets: []

      - id: kpi-definition
        title: Define key indicators to show to users
        status: planned
        body: |
          What indicators, such as progress rate, cost, error rate, and skill hit rate, will be exposed and how.
        tickets: []

  # ──────────────────────────────────────────────────────────────────────
  - id: uiux
    title: UI/UX continuous improvement
    body: |
      **Not a design that is finalized once, but an area of ​​continuous improvement**. How users feel when using the system
      The process of constantly eliminating friction.

      Organizational Metaphor: Improving Client Experience.

      Only “About Us” is written in the design direction, and specific improvements are processed cumulatively on a ticket basis.
      Examples include: Board terminals, input forms, rendering, animations, status displays, keyboard operations, and all other surfaces.

      #News

      - Prohibit use of emojis/icons in terminal output
      - Create SVG icons directly in UI other than the terminal (external fonts/libraries are prohibited)
      - Theme: Dark, Terracotta Orange (#D97757)
      - Mermaid diagrams follow design-mermaid-diagrams skill rules
    milestones:
      - id: roadmap-editor
        title: Roadmap Edit UI
        status: planned
        body: |
          Currently editing the ROADMAP.yaml text directly. Enable inline editing in this panel.

          - Add/delete/change phase/milestone order
          - status toggle (planned ↔ in-progress ↔ done)
          - Ticket connect/disconnect
          - body markdown editor (same as CLAUDE.md Edit pattern)
        tickets: []

      - id: relations-feature-extension
        title: Expanding Relations Panel Functionality
        status: planned
        body: |
          Currently the Relations panel is a ticket dependency graph visualization + status filter + layout toggle + isolated
          Toggle + Permanence completed.

          Follow-up ideas:
          - Mini metadata hover when clicked (title/status/connection)
          - Add milestone node (which milestone the ticket belongs to)
          - Progress heatmap
        tickets: []

      - id: board-friction-reduction
        title: Always eliminate board friction
        status: in-progress
        body: |
          Cumulative processing of friction found by users during actual use on a ticket-by-ticket basis. A permanently living milestone.

          Example (already processed):
          - SSE git_branch automatic update (no refresh required)
          - Roadmap → Relations transfer rename
          - Relations panel persistence, two-phase render, SVG icon
          - Arrow·empty icon font glyph → SVG
        tickets: []

  # ──────────────────────────────────────────────────────────────────────
  - id: platform
    title: Platform Constraints
    body: |
      ## Notice

      - **No plans to break away from Claude Code dependency** — claude-workflow runs on the Claude Code host.
        It is maintained as a working meta layer.
      - In other words, switching to standalone CLI + independent SDK like GSD-2 is **excluded from the options**.
      - If you have an idea to bring, please bring it within the scope of Claude Code's functions (hook/skill/agent/slash command)
        Transform it into a form that can be implemented and accept it.
    milestones: []
